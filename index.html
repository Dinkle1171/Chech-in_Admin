<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作人員補登系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 引入 QR Code 掃描庫 -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.263.1"
        }
    }
    </script>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { QrCode, UserPlus, CheckCircle, XCircle, Camera, Keyboard, Loader2, ScanLine, CalendarDays, RefreshCw } from 'lucide-react';

        // ----------------------------------------------------------------------
        // 【重要】請填入與員工端相同的 Web App URL
        // ----------------------------------------------------------------------
        const API_URL = "https://script.google.com/macros/s/AKfycbw8CVz0OvO3mU1KAONyJ4amDj49eCv0HZ5wVUNLgYtJa-LCAgZel2UxvxAMQGQn8Ro3WA/exec";
        
        function StaffApp() {
            const [mode, setMode] = useState('scan'); 
            const [scannedData, setScannedData] = useState({ session: '', id: '', name: '' });
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState({ status: '', msg: '' });
            
            const [sessionList, setSessionList] = useState([]);
            const [activityName, setActivityName] = useState('');
            const [dataLoaded, setDataLoaded] = useState(false);
            const [lockedSession, setLockedSession] = useState(null);
            
            const scannerRef = useRef(null);

            const theme = {
                primary: '#EE1C25',    
                bg: '#F3F4F6',        
                success: '#10B981',    
            };

            // 1. 初始化
            useEffect(() => {
                if (API_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
                    console.error("API URL 未設定");
                    return;
                }

                const parseUrlSession = (sessions) => {
                    try {
                        const params = new URLSearchParams(window.location.search);
                        const indexParam = params.get('i');
                        if (indexParam !== null) {
                            const index = parseInt(indexParam, 10);
                            if (!isNaN(index) && sessions[index]) {
                                return sessions[index];
                            }
                        }
                    } catch (e) {
                        console.error("URL 解析失敗", e);
                    }
                    return null;
                };

                fetch(API_URL)
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === 'success') {
                            if (data.sessions) {
                                setSessionList(data.sessions);
                                const urlSession = parseUrlSession(data.sessions);
                                const singleSession = data.sessions.length === 1 ? data.sessions[0] : null;
                                const targetSession = urlSession || singleSession;

                                if (targetSession) {
                                    setScannedData(prev => ({...prev, session: targetSession}));
                                    setLockedSession(targetSession);
                                }
                            }
                            if (data.activityName) setActivityName(data.activityName);
                        }
                    })
                    .catch(err => console.error("無法取得最新資料", err))
                    .finally(() => setDataLoaded(true));
            }, []);

            // 2. 啟動掃描器 (增加 !dataLoaded 判斷，確保資料載入後才啟動)
            useEffect(() => {
                if (mode === 'scan' && dataLoaded) {
                    const timer = setTimeout(() => {
                        const html5QrCode = new Html5Qrcode("reader");
                        scannerRef.current = html5QrCode;
                        const config = { fps: 10, qrbox: { width: 250, height: 250 } };
                        html5QrCode.start({ facingMode: "environment" }, config, (decodedText) => {
                            handleScanSuccess(decodedText);
                            html5QrCode.stop().catch(err => console.error(err));
                        }, (errorMessage) => {}).catch(err => console.error("Camera start failed", err));
                    }, 100);
                    return () => {
                        clearTimeout(timer);
                        if (scannerRef.current && scannerRef.current.isScanning) {
                            scannerRef.current.stop().catch(err => console.error(err));
                        }
                    };
                }
            }, [mode, dataLoaded]); // 加入 dataLoaded 依賴

            // 3. 解析 QR Code
            const handleScanSuccess = (text) => {
                try {
                    const decoded = decodeURIComponent(text);
                    const sessionMatch = decoded.match(/SESSION:([^,]+)/);
                    const idMatch = decoded.match(/ID:([^,]+)/);
                    const nameMatch = decoded.match(/NAME:(.+)/);

                    if (idMatch && nameMatch) {
                        setScannedData(prev => ({ 
                            session: lockedSession || (sessionMatch ? sessionMatch[1] : ''), 
                            id: idMatch[1], 
                            name: nameMatch[1] 
                        }));
                        setMode('confirm');
                    } else {
                        alert("QR Code 格式不符");
                        setMode('scan'); 
                    }
                } catch (e) {
                    console.error(e);
                    alert("解析錯誤");
                }
            };

            // 4. 送出補登
            const handleRegister = async () => {
                if (sessionList.length > 0 && !scannedData.session) {
                    alert("請務必選擇場次！");
                    return;
                }

                setLoading(true);
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ 
                            action: 'register',
                            session: scannedData.session,
                            id: scannedData.id, 
                            name: scannedData.name 
                        }),
                    });
                    const data = await response.json();

                    if (data.status === 'success') {
                        setResult({ status: 'success', msg: `${data.data.session ? `[${data.data.session}] ` : ''}${data.data.name} 補登成功！` });
                    } else {
                        setResult({ status: 'error', msg: data.message || '補登失敗' });
                    }
                    setMode('result');
                } catch (err) {
                    setResult({ status: 'error', msg: '網路連線錯誤' });
                    setMode('result');
                } finally {
                    setLoading(false);
                }
            };

            const reset = () => {
                setScannedData({ 
                    session: lockedSession || '', 
                    id: '', 
                    name: '' 
                });
                setMode('scan');
                setResult({ status: '', msg: '' });
            };

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4 font-sans relative overflow-hidden" 
                     style={{ backgroundColor: theme.bg }}>
                     
                    {/* Header */}
                    <div className="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden z-10 relative border-t-8 mb-4" style={{ borderColor: theme.primary }}>
                         <div className="pt-5 pb-4 px-6 text-center bg-white relative">
                            <div className="flex justify-center mb-2">
                                <img src="https://i.meee.com.tw/bxhfqhV.jpg" alt="Dinkle" className="h-10" />
                            </div>
                            <h1 className="text-xl font-bold text-gray-800 flex flex-col items-center justify-center gap-1">
                                <div className="flex items-center gap-2">
                                    <UserPlus className="w-6 h-6" style={{ color: theme.primary }} />
                                    工作人員補登系統
                                </div>
                                {dataLoaded ? (
                                    <span className="text-sm font-medium text-gray-500 bg-gray-100 px-2 py-0.5 rounded-full mt-1 animate-in fade-in">
                                        {activityName || "(無活動名稱)"}
                                    </span>
                                ) : (
                                    <div className="h-5 w-32 bg-gray-100 rounded animate-pulse mt-1"></div>
                                )}
                            </h1>
                        </div>
                    </div>

                    <div className="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden z-10 p-6 min-h-[400px] flex flex-col justify-center">
                        
                        {/* 載入中狀態 (遮罩) */}
                        {!dataLoaded ? (
                            <div className="flex flex-col items-center justify-center py-10 animate-in fade-in">
                                <Loader2 className="w-12 h-12 text-gray-300 animate-spin mb-4" />
                                <p className="text-gray-500 font-bold text-lg">系統資料載入中...</p>
                                <p className="text-gray-400 text-sm mt-2">請稍候，正在同步場次資訊</p>
                            </div>
                        ) : (
                            /* 資料載入完成後才顯示功能區 */
                            <>
                                {mode === 'scan' && (
                                    <div className="flex flex-col items-center animate-in fade-in">
                                        <p className="text-gray-600 mb-4 font-bold text-center">請掃描員工手機上的<br/><span className="text-red-500">紅色 QR Code</span></p>
                                        <div id="reader" className="w-full bg-black rounded-lg overflow-hidden mb-4 border-4 border-gray-100" style={{ minHeight: '300px' }}></div>
                                        <button onClick={() => setMode('manual')} className="text-gray-500 text-sm flex items-center gap-1 mt-2 underline hover:text-gray-800 transition-colors">
                                            <Keyboard className="w-4 h-4" /> 切換手動輸入工號
                                        </button>
                                    </div>
                                )}

                                {mode === 'confirm' && (
                                    <div className="text-center animate-in zoom-in duration-200">
                                        <h2 className="text-lg font-bold text-gray-700 mb-4">確認補登資料</h2>
                                        
                                        <div className="space-y-4 mb-6 text-left">
                                            {/* 場次選單 */}
                                            {sessionList.length > 0 && (
                                                <div>
                                                    <label className="text-xs font-bold text-gray-500 uppercase flex items-center gap-1">
                                                        <CalendarDays className="w-3 h-3"/> 活動場次 Session <span className="text-red-500">*</span>
                                                    </label>
                                                    <div className="relative mt-1">
                                                        <select 
                                                            value={scannedData.session} 
                                                            onChange={(e) => setScannedData({...scannedData, session: e.target.value})}
                                                            className={`w-full p-3 bg-gray-50 border-2 border-gray-200 rounded-lg font-bold text-gray-800 focus:border-red-500 outline-none appearance-none disabled:text-gray-500 disabled:bg-gray-100`}
                                                            disabled={!!lockedSession}
                                                        >
                                                            {(!lockedSession && sessionList.length > 1) && <option value="">-- 請選擇場次 --</option>}
                                                            {sessionList.map((s, i) => (
                                                                <option key={i} value={s}>{s}</option>
                                                            ))}
                                                        </select>
                                                        {!lockedSession && (
                                                            <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                                                                <svg className="h-4 w-4 fill-current" viewBox="0 0 20 20"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" /></svg>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            )}

                                            <div className="bg-gray-50 p-4 rounded-lg border-l-4" style={{ borderColor: theme.primary }}>
                                                <p className="text-xs text-gray-500 uppercase">工號 ID</p>
                                                <p className="text-xl font-bold text-gray-800 mb-2">{scannedData.id}</p>
                                                <p className="text-xs text-gray-500 uppercase">姓名 Name</p>
                                                <p className="text-xl font-bold text-gray-800">{scannedData.name}</p>
                                            </div>
                                        </div>

                                        <div className="flex gap-3">
                                            <button onClick={reset} className="flex-1 py-3 border border-gray-300 rounded-lg text-gray-600 font-bold hover:bg-gray-50 transition-colors">
                                                取消
                                            </button>
                                            <button onClick={handleRegister} disabled={loading} 
                                                    className="flex-1 py-3 rounded-lg text-white font-bold flex items-center justify-center gap-2 shadow-md hover:brightness-110 transition-all"
                                                    style={{ backgroundColor: theme.primary }}>
                                                {loading ? <Loader2 className="animate-spin w-5 h-5"/> : '確認補登'}
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {mode === 'result' && (
                                    <div className="text-center py-4 animate-in zoom-in duration-300">
                                        {result.status === 'success' ? (
                                            <div>
                                                <CheckCircle className="w-16 h-16 mx-auto mb-4 text-green-500" />
                                                <h2 className="text-xl font-bold mb-2 text-gray-800">補登完成</h2>
                                            </div>
                                        ) : (
                                            <div>
                                                <XCircle className="w-16 h-16 mx-auto mb-4 text-red-500" />
                                                <h2 className="text-xl font-bold mb-2 text-gray-800">補登失敗</h2>
                                            </div>
                                        )}
                                        <p className="text-gray-600 mb-6 font-medium">{result.msg}</p>
                                        <button onClick={reset} className="w-full py-3 bg-gray-800 text-white rounded-lg font-bold hover:bg-black transition-colors">
                                            掃描下一位
                                        </button>
                                    </div>
                                )}

                                {mode === 'manual' && (
                                    <div className="animate-in fade-in">
                                        <h2 className="text-lg font-bold text-gray-700 mb-4 text-center">手動輸入補登</h2>
                                        <div className="space-y-4 mb-6">
                                            {/* 手動模式場次選單 */}
                                            {sessionList.length > 0 && (
                                                <div>
                                                    <label className="block text-sm font-bold text-gray-600 mb-1">場次 <span className="text-red-500">*</span></label>
                                                    <select 
                                                        value={scannedData.session} 
                                                        onChange={(e) => setScannedData({...scannedData, session: e.target.value})}
                                                        className="w-full p-3 border rounded-lg bg-white appearance-none disabled:bg-gray-100 disabled:text-gray-500"
                                                        disabled={!!lockedSession}
                                                    >
                                                        {(!lockedSession && sessionList.length > 1) && <option value="">請選擇場次</option>}
                                                        {sessionList.map((s, i) => (
                                                            <option key={i} value={s}>{s}</option>
                                                        ))}
                                                    </select>
                                                </div>
                                            )}

                                            <div>
                                                <label className="block text-sm font-bold text-gray-600 mb-1">工號 <span className="text-red-500">*</span></label>
                                                <input type="text" value={scannedData.id} onChange={(e) => setScannedData({...scannedData, id: e.target.value})} 
                                                    className="w-full p-3 border rounded-lg focus:border-red-500 outline-none" placeholder="輸入工號" />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-gray-600 mb-1">姓名 <span className="text-red-500">*</span></label>
                                                <input type="text" value={scannedData.name} onChange={(e) => setScannedData({...scannedData, name: e.target.value})} 
                                                    className="w-full p-3 border rounded-lg focus:border-red-500 outline-none" placeholder="輸入姓名" />
                                            </div>
                                        </div>
                                        <div className="flex gap-3">
                                            <button onClick={reset} className="flex-1 py-3 border border-gray-300 rounded-lg text-gray-600 font-bold">取消</button>
                                            <button onClick={() => setMode('confirm')} className="flex-1 py-3 bg-gray-800 text-white rounded-lg font-bold">下一步</button>
                                        </div>
                                    </div>
                                )}
                            </>
                        )}
                    </div>
                    
                    <div className="mt-8 text-center text-xs text-gray-400">
                        © DINKLE Staff System
                    </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<StaffApp />);
    </script>
</body>
</html>
